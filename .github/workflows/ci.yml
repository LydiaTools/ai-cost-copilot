name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript and HTML
        run: |
          node --check app.js
          python -c 'from html.parser import HTMLParser; p=HTMLParser(); p.feed(open("index.html", encoding="utf-8").read())'
